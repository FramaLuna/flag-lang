name: build

on:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: msys2 {0}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gdb git diffutils
      - if: runner.os == 'Windows'
        run: echo "CC=gcc" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: command -v gdb || { sudo apt-get update -qq && sudo apt-get install -y -qq gdb > /dev/null; }
      - run: ./build.sh package
      - run: ./test.sh build/flagc 2>&1 | tee build/test.log; exit ${PIPESTATUS[0]}
      - if: failure()
        run: awk '{gsub(/\033\[[0-9;]*m/, ""); gsub(/%/, "%25"); gsub(/\r/, "")} / passed, [0-9]+ failed$/{next} /^FAIL /{if (m) print m; m = "::error::" $0; n = 0; next} m && n < 12 {m = m "%0A" $0; n++} END {if (m) print m}' build/test.log
      - uses: actions/upload-artifact@v7
        with:
          name: flag-${{ runner.os }}
          path: build/flag-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: grep -qx "version=${GITHUB_REF_NAME#v}" build.sh
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - run: awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = $2 == v; next} p' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" packages/*.tar.gz --draft --title "Flag $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
